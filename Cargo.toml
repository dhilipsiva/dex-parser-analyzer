[workspace]
members = [
    "dex-analysis", "dex-cli",
    "dex-core",
    "dex-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["dhilipsiva"]
repository = "https://github.com/dhilipsiva/dex-parser-analyzer"

[package]
name = "dex-gui"
description = "In-browser DEX analyzer (Leptos and WebAssembly); the uploaded file never leaves the machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
log = "0.4"
gloo-file = { version = "0.3", features = ["futures"] }

dex-core = { path = "../dex-core", version = "0.1.0" }
dex-analysis = { path = "../dex-analysis", version = "0.1.0" }
